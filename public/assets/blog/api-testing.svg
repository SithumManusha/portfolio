<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">API testing workflow</title>
  <desc id="desc">A visual API testing workflow showing a request entering an API and a validated response returning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#062b3a"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1060" cy="130" r="180" fill="#22d3ee" opacity=".1"/><circle cx="120" cy="600" r="190" fill="#38bdf8" opacity=".08"/>
  <text x="84" y="92" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">API QUALITY ENGINEERING</text>
  <text x="84" y="146" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="800">Request → API → Response</text>
  <text x="84" y="183" fill="#bae6fd" font-family="Arial, sans-serif" font-size="20">Check the conversation behind every screen</text>
  <g filter="url(#shadow)">
    <rect x="88" y="270" width="250" height="190" rx="20" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
    <text x="213" y="318" fill="#cffafe" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">CLIENT REQUEST</text>
    <rect x="128" y="348" width="170" height="34" rx="8" fill="#082f49"/><text x="145" y="371" fill="#67e8f9" font-family="monospace" font-size="16">POST /api/login</text>
    <rect x="128" y="394" width="170" height="34" rx="8" fill="#082f49"/><text x="145" y="417" fill="#bae6fd" font-family="monospace" font-size="15">email + password</text>
    <rect x="468" y="238" width="264" height="254" rx="132" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="600" cy="366" r="82" fill="#172554" opacity=".72"/><text x="600" y="355" fill="#dbeafe" font-family="Arial" font-size="26" font-weight="800" text-anchor="middle">API</text><text x="600" y="389" fill="#93c5fd" font-family="Arial" font-size="17" text-anchor="middle">validate • process</text>
    <rect x="862" y="270" width="250" height="190" rx="20" fill="#0369a1" stroke="#7dd3fc" stroke-width="2"/>
    <text x="987" y="318" fill="#e0f2fe" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">VALIDATED RESPONSE</text>
    <rect x="902" y="348" width="170" height="34" rx="8" fill="#082f49"/><text x="987" y="371" fill="#86efac" font-family="monospace" font-size="16" text-anchor="middle">200 OK</text>
    <rect x="902" y="394" width="170" height="34" rx="8" fill="#082f49"/><text x="987" y="417" fill="#bae6fd" font-family="monospace" font-size="15" text-anchor="middle">JSON + token</text>
  </g>
  <path d="M338 366 H468 M732 366 H862" stroke="url(#pipe)" stroke-width="10" stroke-linecap="round"/><path d="m450 348 24 18-24 18 M844 348 868 366l-24 18" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="566" width="1032" height="1" fill="#a5f3fc" opacity=".35"/><text x="84" y="612" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Status code • schema • security • response time</text><text x="1116" y="612" fill="#67e8f9" font-family="Arial, sans-serif" font-size="18" text-anchor="end" font-weight="700">POSTMAN / JSON</text>
</svg>
