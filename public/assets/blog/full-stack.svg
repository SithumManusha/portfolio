<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Full-stack quality by design</title>
  <desc id="desc">A full-stack architecture visual connecting a React user interface, API, service, database, and CI/CD delivery.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#08051c" flood-opacity=".5"/></filter></defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/><circle cx="1050" cy="115" r="180" fill="#c4b5fd" opacity=".12"/><circle cx="130" cy="580" r="210" fill="#818cf8" opacity=".1"/>
  <text x="84" y="92" fill="#ddd6fe" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">FULL-STACK DEVELOPMENT</text><text x="84" y="146" fill="#f5f3ff" font-family="Arial" font-size="42" font-weight="800">Quality across the stack</text><text x="84" y="183" fill="#c4b5fd" font-family="Arial" font-size="20">One reliable feature, from browser to deployment</text>
  <g filter="url(#shadow)"><rect x="74" y="280" width="190" height="150" rx="18" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/><rect x="314" y="280" width="190" height="150" rx="18" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/><rect x="554" y="280" width="190" height="150" rx="18" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/><rect x="794" y="280" width="190" height="150" rx="18" fill="#059669" stroke="#86efac" stroke-width="2"/><rect x="1012" y="280" width="130" height="150" rx="18" fill="#d97706" stroke="#fde68a" stroke-width="2"/>
  <text x="169" y="336" fill="white" font-family="Arial" font-size="22" font-weight="800" text-anchor="middle">REACT UI</text><text x="169" y="370" fill="#dbeafe" font-family="Arial" font-size="15" text-anchor="middle">accessible states</text><text x="169" y="397" fill="#dbeafe" font-family="Arial" font-size="15" text-anchor="middle">component tests</text>
  <text x="409" y="336" fill="white" font-family="Arial" font-size="22" font-weight="800" text-anchor="middle">REST API</text><text x="409" y="370" fill="#ede9fe" font-family="Arial" font-size="15" text-anchor="middle">contracts</text><text x="409" y="397" fill="#ede9fe" font-family="Arial" font-size="15" text-anchor="middle">authorization</text>
  <text x="649" y="336" fill="white" font-family="Arial" font-size="22" font-weight="800" text-anchor="middle">SERVICE</text><text x="649" y="370" fill="#cffafe" font-family="Arial" font-size="15" text-anchor="middle">business rules</text><text x="649" y="397" fill="#cffafe" font-family="Arial" font-size="15" text-anchor="middle">validation</text>
  <text x="889" y="336" fill="white" font-family="Arial" font-size="22" font-weight="800" text-anchor="middle">DATABASE</text><text x="889" y="370" fill="#d1fae5" font-family="Arial" font-size="15" text-anchor="middle">constraints</text><text x="889" y="397" fill="#d1fae5" font-family="Arial" font-size="15" text-anchor="middle">integrity</text>
  <text x="1077" y="336" fill="white" font-family="Arial" font-size="20" font-weight="800" text-anchor="middle">CI/CD</text><text x="1077" y="370" fill="#fef3c7" font-family="Arial" font-size="14" text-anchor="middle">build</text><text x="1077" y="397" fill="#fef3c7" font-family="Arial" font-size="14" text-anchor="middle">test</text></g>
  <path d="M264 355h50m190 0h50m190 0h50m190 0h28" stroke="#ddd6fe" stroke-width="8" stroke-linecap="round"/><path d="m294 340 18 15-18 15m240-15 18 15-18 15m240-15 18 15-18 15m240-15 18 15-18 15" fill="none" stroke="#f5f3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="566" width="1032" height="1" fill="#ddd6fe" opacity=".35"/><text x="84" y="612" fill="#e0e7ff" font-family="Arial" font-size="18">UI • API • data • security • tests • observability</text><text x="1116" y="612" fill="#c4b5fd" font-family="Arial" font-size="18" text-anchor="end" font-weight="700">END TO END</text>
</svg>
