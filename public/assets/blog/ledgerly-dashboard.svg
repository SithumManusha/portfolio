<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ledgerly finance dashboard</title>
  <desc id="desc">A dark finance dashboard showing balance, spending, budget health, expense analytics, receipt OCR, multi-currency and secure data features.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="30" x2="1140" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2C26"/>
      <stop offset="0.55" stop-color="#071C1A"/>
      <stop offset="1" stop-color="#04100F"/>
    </linearGradient>
    <linearGradient id="accent" x1="235" y1="175" x2="1040" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#133A32"/>
      <stop offset="1" stop-color="#0B2622"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020908" flood-opacity="0.5"/>
    </filter>
  </defs>

