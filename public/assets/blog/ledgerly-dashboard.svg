  <path d="M102 94H122C124.2 94 126 95.8 126 98V108C126 110.2 124.2 112 122 112H102C99.8 112 98 110.2 98 108V98C98 95.8 99.8 94 102 94Z" stroke="#04211B" stroke-width="2.5"/>
