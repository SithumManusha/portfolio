<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">QA testing journey</title>
  <desc id="desc">A four-step quality assurance journey from understanding a requirement to improving a release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1f3a"/><stop offset="1" stop-color="#123c4a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="150" fill="#2dd4bf" opacity=".1"/><circle cx="180" cy="600" r="210" fill="#60a5fa" opacity=".08"/>
  <text x="84" y="92" fill="#99f6e4" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">QA FUNDAMENTALS</text>
  <text x="84" y="146" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="800">From requirement to release</text>
  <text x="84" y="183" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="20">A simple, repeatable quality journey</text>
  <path d="M180 370 C300 230 420 510 540 370 S780 230 900 370" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 16"/>
  <g filter="url(#shadow)">
    <g><circle cx="180" cy="370" r="72" fill="#2563eb"/><circle cx="180" cy="370" r="72" fill="none" stroke="#93c5fd" stroke-width="3"/><text x="180" y="360" fill="white" font-family="Arial" font-size="34" font-weight="800" text-anchor="middle">01</text><text x="180" y="396" fill="#dbeafe" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">UNDERSTAND</text></g>
    <g><circle cx="420" cy="480" r="72" fill="#0d9488"/><circle cx="420" cy="480" r="72" fill="none" stroke="#99f6e4" stroke-width="3"/><text x="420" y="470" fill="white" font-family="Arial" font-size="34" font-weight="800" text-anchor="middle">02</text><text x="420" y="506" fill="#ccfbf1" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">PLAN</text></g>
    <g><circle cx="660" cy="260" r="72" fill="#d97706"/><circle cx="660" cy="260" r="72" fill="none" stroke="#fde68a" stroke-width="3"/><text x="660" y="250" fill="white" font-family="Arial" font-size="34" font-weight="800" text-anchor="middle">03</text><text x="660" y="286" fill="#fef3c7" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">TEST</text></g>
    <g><circle cx="900" cy="370" r="72" fill="#7c3aed"/><circle cx="900" cy="370" r="72" fill="none" stroke="#ddd6fe" stroke-width="3"/><text x="900" y="360" fill="white" font-family="Arial" font-size="34" font-weight="800" text-anchor="middle">04</text><text x="900" y="396" fill="#ede9fe" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">IMPROVE</text></g>
  </g>
  <rect x="84" y="566" width="1032" height="1" fill="#99f6e4" opacity=".35"/><text x="84" y="612" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Clear questions • repeatable tests • useful evidence</text><text x="1116" y="612" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" text-anchor="end" font-weight="700">QA / STLC</text>
</svg>
