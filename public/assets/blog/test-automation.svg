<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Test automation roadmap</title>
  <desc id="desc">A visual test automation pyramid and CI pipeline showing unit, API, and end-to-end layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="pyramid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#08051c" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/><circle cx="1040" cy="100" r="180" fill="#c4b5fd" opacity=".12"/><circle cx="150" cy="570" r="210" fill="#818cf8" opacity=".1"/>
  <text x="84" y="92" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">TEST AUTOMATION ENGINEERING</text>
  <text x="84" y="146" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="42" font-weight="800">Automate with a purpose</text>
  <text x="84" y="183" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="20">More fast feedback, fewer fragile UI checks</text>
  <g filter="url(#shadow)">
    <path d="M160 500 L390 250 L620 500 Z" fill="url(#pyramid)" stroke="#ddd6fe" stroke-width="3"/>
    <path d="M205 450 L390 250 L575 450 Z" fill="#4f46e5" opacity=".52"/>
    <path d="M250 400 L390 250 L530 400 Z" fill="#7c3aed" opacity=".5"/>
    <line x1="160" y1="500" x2="620" y2="500" stroke="#ede9fe" stroke-width="3"/><line x1="205" y1="450" x2="575" y2="450" stroke="#ede9fe" stroke-width="3" opacity=".9"/><line x1="250" y1="400" x2="530" y2="400" stroke="#ede9fe" stroke-width="3" opacity=".9"/>
    <text x="390" y="485" fill="#eef2ff" font-family="Arial" font-size="20" font-weight="800" text-anchor="middle">UNIT TESTS</text><text x="390" y="435" fill="#eef2ff" font-family="Arial" font-size="18" font-weight="800" text-anchor="middle">API / INTEGRATION</text><text x="390" y="370" fill="#ffffff" font-family="Arial" font-size="18" font-weight="800" text-anchor="middle">E2E UI</text>
    <rect x="718" y="268" width="382" height="236" rx="20" fill="#11103b" stroke="#a78bfa" stroke-width="2"/><text x="760" y="312" fill="#c4b5fd" font-family="monospace" font-size="17">CI / CD PIPELINE</text>
    <rect x="760" y="350" width="92" height="48" rx="10" fill="#4f46e5"/><text x="806" y="380" fill="white" font-family="Arial" font-size="15" font-weight="700" text-anchor="middle">COMMIT</text><rect x="872" y="350" width="92" height="48" rx="10" fill="#7c3aed"/><text x="918" y="380" fill="white" font-family="Arial" font-size="15" font-weight="700" text-anchor="middle">BUILD</text><rect x="984" y="350" width="92" height="48" rx="10" fill="#059669"/><text x="1030" y="380" fill="white" font-family="Arial" font-size="15" font-weight="700" text-anchor="middle">TEST</text>
    <path d="M852 374h20m92 0h20" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/><text x="760" y="445" fill="#a5b4fc" font-family="monospace" font-size="16">✓ report results + failure evidence</text>
  </g>
  <rect x="84" y="566" width="1032" height="1" fill="#ddd6fe" opacity=".35"/><text x="84" y="612" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="18">Stable selectors • useful assertions • reliable feedback</text><text x="1116" y="612" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="18" text-anchor="end" font-weight="700">SELENIUM / PLAYWRIGHT</text>
</svg>
